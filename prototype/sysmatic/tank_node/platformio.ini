; PlatformIO build of the same ESP-IDF project (alternative to idf.py).
;   pio run                 -> .pio/build/esp32dev/firmware.bin
;   pio run -t upload       -> flash over USB
;   pio device monitor      -> 115200
; Needs platform espressif32 with IDF 5.3+ for the esp_driver_* component names.
; Verified with the installed platform (framework-espidf 6.1.0): SUCCESS, 181 KB flash.
[platformio]
default_envs = esp32dev
src_dir = main

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = espidf
monitor_speed = 115200
monitor_filters = direct
board_build.flash_size = 4MB

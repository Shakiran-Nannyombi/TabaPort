<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TabaPort · {% block title %}{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="page-{{ page }}">
<header class="topbar">
  <div class="brand">
    <span class="logo"></span>
    <span class="name">TabaPort</span>
    <span class="sub">Kampala drainage dispatch · offline</span>
  </div>
  <nav>
    <a href="/map" class="{{ 'active' if page=='map' }}">Map</a>
    <a href="/jobs" class="{{ 'active' if page=='jobs' }}">Jobs <span id="nav-open-count" class="pill hidden">0</span></a>
    <a href="/node" class="{{ 'active' if page=='node' }}">Live node</a>
    <a href="/settings" class="{{ 'active' if page=='settings' }}">Settings</a>
  </nav>
  <div class="status">
    <span id="st-node" class="badge unknown">drain_01 · waiting</span>
    <span id="st-serial" class="dot" title="serial link"></span>
    <span id="st-clock"></span>
  </div>
</header>
<main>{% block content %}{% endblock %}</main>
<script src="{{ url_for('static', filename='app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>

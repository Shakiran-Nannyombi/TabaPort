<text x="715" y="812" font-size="13" text-anchor="middle" fill="#c0392b" font-weight="bold">sensor +5V → VIN  (not 3V3: the JSN-SR04T will not fire on 3.3 V)</text>
<rect x="30" y="560" width="440" height="200" rx="8" fill="#f7f7f7" stroke="#ccc"/>
<text x="44" y="586" font-size="13" text-anchor="start" fill="#111" font-weight="bold">Why the divider</text>
<text x="44" y="606" font-size="13" text-anchor="start" fill="#111" >Echo is 5 V; ESP32 pins are 3.3 V.</text>
<text x="44" y="626" font-size="13" text-anchor="start" fill="#111" >5 V × 2 kΩ / (1 kΩ + 2 kΩ) = 3.3 V. Two 1 kΩ in series = 2 kΩ.</text>
<text x="44" y="646" font-size="13" text-anchor="start" fill="#111" ></text>
<text x="44" y="666" font-size="13" text-anchor="start" fill="#111" font-weight="bold">Resistor colours</text>
<text x="44" y="686" font-size="13" text-anchor="start" fill="#111" >220 Ω  red red brown   1 kΩ  brown black red   2 kΩ  red black red</text>
<text x="44" y="706" font-size="13" text-anchor="start" fill="#111" ></text>
<text x="44" y="726" font-size="13" text-anchor="start" fill="#111" font-weight="bold">Avoid</text>
<text x="44" y="746" font-size="13" text-anchor="start" fill="#111" >GPIO0, 2, 12, 15 (boot)  ·  GPIO34–39 (input only)  ·  GPIO6–11 (flash)</text>

<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1050" viewBox="0 0 1500 1050" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <rect width="1500" height="1050" fill="#ffffff"/>
  <text x="750" y="40" text-anchor="middle" font-size="30" font-weight="700" fill="#111">TabaPort tank node wiring</text>
  <text x="750" y="68" text-anchor="middle" font-size="16" fill="#555">ESP32 DevKit + JSN-SR04T. Leave USB unplugged until every jumper is in.</text>

  <!-- ========== BLOCK A: SENSOR ========== -->
  <rect x="24" y="90" width="1452" height="300" rx="12" fill="#f7f9fc" stroke="#d0d7e2"/>
  <text x="44" y="122" font-size="18" font-weight="700">A. Four wires to the ultrasonic driver board</text>
  <text x="44" y="146" font-size="14" fill="#555">Use the 4-pin board the probe cable plugs into. Sensor power is 5 V on VIN, never 3V3.</text>

  <!-- ESP32 mini -->
  <rect x="50" y="170" width="200" height="190" rx="10" fill="#1a2330"/>
  <text x="150" y="198" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">ESP32 DevKit</text>
  <rect x="80" y="212" width="80" height="22" rx="4" fill="#c0392b"/><text x="120" y="228" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">VIN</text>
  <rect x="80" y="244" width="80" height="22" rx="4" fill="#222"/><text x="120" y="260" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">GND</text>
  <rect x="80" y="276" width="80" height="22" rx="4" fill="#2980b9"/><text x="120" y="292" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">GPIO5</text>
  <rect x="80" y="308" width="80" height="22" rx="4" fill="#d35400"/><text x="120" y="324" text-anchor="middle" fill="#fff" font-size="12" font-weight="700">GPIO18</text>
  <text x="150" y="350" text-anchor="middle" fill="#e74c3c" font-size="12" font-weight="700">do not use 3V3</text>

  <!-- four horizontal wires, start after the ESP32 box (x=250) so labels do not sit on the board -->
  <line x1="250" y1="223" x2="520" y2="223" stroke="#c0392b" stroke-width="6"/>
  <text x="270" y="214" font-size="14" fill="#c0392b" font-weight="700">red   VIN → VCC</text>

  <line x1="250" y1="255" x2="520" y2="255" stroke="#222" stroke-width="6"/>
  <text x="270" y="246" font-size="14" fill="#222" font-weight="700">black   GND → GND</text>

  <line x1="250" y1="287" x2="520" y2="287" stroke="#2980b9" stroke-width="6"/>
  <text x="270" y="278" font-size="14" fill="#2980b9" font-weight="700">blue   GPIO5 → Trig</text>

  <line x1="250" y1="319" x2="520" y2="319" stroke="#d35400" stroke-width="6"/>
  <text x="270" y="344" font-size="14" fill="#d35400" font-weight="700">orange   Echo → divider (section B), not straight to GPIO18</text>

  <!-- sensor -->
  <rect x="520" y="175" width="280" height="180" rx="10" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="660" y="202" text-anchor="middle" font-size="16" font-weight="700">JSN-SR04T driver</text>
  <circle cx="548" cy="223" r="8" fill="#c0392b"/><text x="566" y="228" font-size="14">VCC   +5V</text>
  <circle cx="548" cy="255" r="8" fill="#222"/><text x="566" y="260" font-size="14">GND</text>
  <circle cx="548" cy="287" r="8" fill="#2980b9"/><text x="566" y="292" font-size="14">Trig</text>
  <circle cx="548" cy="319" r="8" fill="#d35400"/><text x="566" y="324" font-size="14">Echo  (5 V)</text>
  <line x1="800" y1="265" x2="860" y2="265" stroke="#111" stroke-dasharray="5 4" stroke-width="2"/>
  <rect x="860" y="210" width="72" height="110" rx="36" fill="#e8eaed" stroke="#111" stroke-width="2"/>
  <text x="896" y="270" text-anchor="middle" font-size="13">probe</text>
  <text x="896" y="340" text-anchor="middle" font-size="12" fill="#555">points down</text>

  <!-- resistor colour card -->
  <rect x="980" y="175" width="470" height="180" rx="10" fill="#fff" stroke="#d0d7e2"/>
  <text x="1000" y="206" font-size="16" font-weight="700">Resistor colours in the kit</text>
  <text x="1000" y="240" font-size="15">1 kΩ     brown · black · red</text>
  <text x="1000" y="268" font-size="15">2 kΩ     red · black · red     (or two 1 kΩ in series)</text>
  <text x="1000" y="296" font-size="15">220 Ω    red · red · brown</text>
  <text x="1000" y="332" font-size="14" fill="#c0392b" font-weight="700">LED long leg = anode, toward the 220 Ω. Short / flat = GND.</text>

  <!-- ========== BLOCK B: DIVIDER ========== -->
  <rect x="24" y="406" width="1452" height="220" rx="12" fill="#fff8e8" stroke="#e0b060"/>
  <text x="44" y="438" font-size="18" font-weight="700" fill="#9a5b00">B. Echo divider — do this before plugging USB in</text>
  <text x="44" y="462" font-size="14" fill="#555">The Echo pin is 5 V. GPIO18 is 3.3 V. Without the divider you will slowly damage GPIO18.</text>

  <!-- flow: Echo -> 1k -> junction GPIO18 -> 2k -> GND -->
  <rect x="80" y="500" width="140" height="70" rx="8" fill="#d35400"/>
  <text x="150" y="530" text-anchor="middle" fill="#fff" font-size="15" font-weight="700">Echo pin</text>
  <text x="150" y="552" text-anchor="middle" fill="#ffe" font-size="13">5 V from sensor</text>

  <line x1="220" y1="535" x2="300" y2="535" stroke="#d35400" stroke-width="5"/>
  <polygon points="300,528 318,535 300,542" fill="#d35400"/>

  <rect x="330" y="510" width="160" height="50" rx="6" fill="#f5d0a9" stroke="#111" stroke-width="2"/>
  <text x="410" y="540" text-anchor="middle" font-size="16" font-weight="700">1 kΩ series</text>
  <text x="410" y="580" text-anchor="middle" font-size="13">brown-black-red</text>

  <line x1="490" y1="535" x2="570" y2="535" stroke="#d35400" stroke-width="5"/>
  <polygon points="570,528 588,535 570,542" fill="#d35400"/>

  <circle cx="640" cy="535" r="50" fill="#fff" stroke="#d35400" stroke-width="4"/>
  <text x="640" y="530" text-anchor="middle" font-size="15" font-weight="700">GPIO18</text>
  <text x="640" y="550" text-anchor="middle" font-size="12">3.3 V here</text>

  <line x1="690" y1="535" x2="720" y2="535" stroke="#222" stroke-width="5"/>
  <rect x="720" y="510" width="160" height="50" rx="6" fill="#f5d0a9" stroke="#111" stroke-width="2"/>
  <text x="800" y="540" text-anchor="middle" font-size="16" font-weight="700">2 kΩ</text>
  <line x1="880" y1="535" x2="910" y2="535" stroke="#222" stroke-width="5"/>
  <polygon points="910,528 928,535 910,542" fill="#222"/>
  <rect x="940" y="517" width="100" height="36" rx="6" fill="#222"/>
  <text x="990" y="541" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">GND</text>

  <text x="44" y="600" font-size="15">On the breadboard: Echo jumper into one end of the 1 kΩ. Other end of the 1 kΩ shares a row with a jumper to GPIO18. From that same row, 2 kΩ goes to the GND rail.</text>
  <text x="44" y="624" font-size="15" fill="#9a5b00" font-weight="700">GPIO18 is the middle of the two resistors. If you only have 1 kΩ parts, put two of them in series for the 2 kΩ to ground.</text>

  <!-- ========== BLOCK C: LEDS + BUZZER ========== -->
  <rect x="24" y="644" width="1452" height="380" rx="12" fill="#f7f9fc" stroke="#d0d7e2"/>
  <text x="44" y="676" font-size="18" font-weight="700">C. Three LEDs and the buzzer — four separate circuits, all back to GND</text>
  <text x="44" y="700" font-size="14" fill="#555">Do not chain the LEDs. Each GPIO has its own 220 Ω and its own LED.</text>

  <!-- table-like rows -->
  <!-- header -->
  <rect x="50" y="720" width="200" height="40" fill="#1a2330"/><text x="150" y="746" text-anchor="middle" fill="#fff" font-weight="700">ESP32 pin</text>
  <rect x="250" y="720" width="280" height="40" fill="#1a2330"/><text x="390" y="746" text-anchor="middle" fill="#fff" font-weight="700">resistor</text>
  <rect x="530" y="720" width="280" height="40" fill="#1a2330"/><text x="670" y="746" text-anchor="middle" fill="#fff" font-weight="700">component</text>
  <rect x="810" y="720" width="200" height="40" fill="#1a2330"/><text x="910" y="746" text-anchor="middle" fill="#fff" font-weight="700">then</text>
  <rect x="1010" y="720" width="430" height="40" fill="#1a2330"/><text x="1225" y="746" text-anchor="middle" fill="#fff" font-weight="700">LED / buzzer orientation</text>

  <!-- green row -->
  <rect x="50" y="760" width="200" height="56" fill="#eafaf1" stroke="#c8e6d4"/>
  <text x="150" y="794" text-anchor="middle" font-size="16" font-weight="700" fill="#1e8449">GPIO25</text>
  <rect x="250" y="760" width="280" height="56" fill="#eafaf1" stroke="#c8e6d4"/>
  <text x="390" y="794" text-anchor="middle" font-size="16">220 Ω  (red-red-brown)</text>
  <rect x="530" y="760" width="280" height="56" fill="#eafaf1" stroke="#c8e6d4"/>
  <circle cx="620" cy="788" r="16" fill="#2ecc71" stroke="#111"/><text x="670" y="794" font-size="16" font-weight="700">green LED</text>
  <rect x="810" y="760" width="200" height="56" fill="#eafaf1" stroke="#c8e6d4"/>
  <text x="910" y="794" text-anchor="middle" font-size="16" font-weight="700">GND</text>
  <rect x="1010" y="760" width="430" height="56" fill="#eafaf1" stroke="#c8e6d4"/>
  <text x="1225" y="794" text-anchor="middle" font-size="15">long leg toward 220 Ω</text>

  <!-- yellow row -->
  <rect x="50" y="816" width="200" height="56" fill="#fef9e7" stroke="#f5e6a3"/>
  <text x="150" y="850" text-anchor="middle" font-size="16" font-weight="700" fill="#9a7b00">GPIO26</text>
  <rect x="250" y="816" width="280" height="56" fill="#fef9e7" stroke="#f5e6a3"/>
  <text x="390" y="850" text-anchor="middle" font-size="16">220 Ω  (red-red-brown)</text>
  <rect x="530" y="816" width="280" height="56" fill="#fef9e7" stroke="#f5e6a3"/>
  <circle cx="620" cy="844" r="16" fill="#f1c40f" stroke="#111"/><text x="670" y="850" font-size="16" font-weight="700">yellow LED</text>
  <rect x="810" y="816" width="200" height="56" fill="#fef9e7" stroke="#f5e6a3"/>
  <text x="910" y="850" text-anchor="middle" font-size="16" font-weight="700">GND</text>
  <rect x="1010" y="816" width="430" height="56" fill="#fef9e7" stroke="#f5e6a3"/>
  <text x="1225" y="850" text-anchor="middle" font-size="15">long leg toward 220 Ω</text>

  <!-- red row -->
  <rect x="50" y="872" width="200" height="56" fill="#fdecea" stroke="#f5c6c2"/>
  <text x="150" y="906" text-anchor="middle" font-size="16" font-weight="700" fill="#c0392b">GPIO27</text>
  <rect x="250" y="872" width="280" height="56" fill="#fdecea" stroke="#f5c6c2"/>
  <text x="390" y="906" text-anchor="middle" font-size="16">220 Ω  (red-red-brown)</text>
  <rect x="530" y="872" width="280" height="56" fill="#fdecea" stroke="#f5c6c2"/>
  <circle cx="620" cy="900" r="16" fill="#e74c3c" stroke="#111"/><text x="670" y="906" font-size="16" font-weight="700">red LED</text>
  <rect x="810" y="872" width="200" height="56" fill="#fdecea" stroke="#f5c6c2"/>
  <text x="910" y="906" text-anchor="middle" font-size="16" font-weight="700">GND</text>
  <rect x="1010" y="872" width="430" height="56" fill="#fdecea" stroke="#f5c6c2"/>
  <text x="1225" y="906" text-anchor="middle" font-size="15">short / flat side to GND</text>

  <!-- buzzer row -->
  <rect x="50" y="928" width="200" height="56" fill="#f5eef8" stroke="#d2b4de"/>
  <text x="150" y="962" text-anchor="middle" font-size="16" font-weight="700" fill="#6c3483">GPIO14</text>
  <rect x="250" y="928" width="280" height="56" fill="#f5eef8" stroke="#d2b4de"/>
  <text x="390" y="962" text-anchor="middle" font-size="16">no resistor</text>
  <rect x="530" y="928" width="280" height="56" fill="#f5eef8" stroke="#d2b4de"/>
  <circle cx="620" cy="956" r="16" fill="#eee" stroke="#111"/><text x="670" y="962" font-size="16" font-weight="700">buzzer</text>
  <rect x="810" y="928" width="200" height="56" fill="#f5eef8" stroke="#d2b4de"/>
  <text x="910" y="962" text-anchor="middle" font-size="16" font-weight="700">GND</text>
  <rect x="1010" y="928" width="430" height="56" fill="#f5eef8" stroke="#d2b4de"/>
  <text x="1225" y="962" text-anchor="middle" font-size="15">+ or long leg to GPIO14</text>
</svg>
